<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comfy Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff8a1f'/%3E%3Cpath d='M18 4 8 18h7l-1 10 10-14h-7z' fill='%230c0d10'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/studio/web/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/studio/" aria-label="Comfy Studio home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--safelight)"/><path d="M18 4 8 18h7l-1 10 10-14h-7z" fill="var(--ink)"/></svg>
      <span>Comfy Studio</span>
    </a>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="generate" aria-selected="true">Generate</button>
      <button role="tab" data-tab="library">Library</button>
      <button role="tab" data-tab="downloads">Downloads <span class="count" id="dl-count" hidden></span></button>
      <button role="tab" data-tab="settings">Settings</button>
    </nav>
    <div class="status" id="status" title="Connection to ComfyUI">
      <span class="dot"></span><span class="label">Connecting</span>
    </div>
  </header>

  <main id="view-generate" class="view generate">
    <aside class="rail" aria-label="Models">
      <div class="rail-list" id="models"></div>
      <button class="rail-add ghost" id="add-workflow">Add workflow</button>
    </aside>
    <section class="panel" aria-label="Controls">
      <div class="panel-head" id="panel-head"></div>
      <div class="panel-body" id="panel-body"></div>
      <div class="panel-foot" id="panel-foot"></div>
    </section>
    <section class="stage" aria-label="Output">
      <div class="glow" id="glow"><i></i></div>
      <div class="monitor" id="monitor"></div>
      <div class="strip" id="strip" aria-label="This session"></div>
    </section>
  </main>

  <main id="view-library" class="view page" hidden></main>
  <main id="view-downloads" class="view page" hidden></main>
  <main id="view-settings" class="view page" hidden></main>

  <dialog id="dialog"></dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/studio/web/app.js"></script>
</body>
</html>
